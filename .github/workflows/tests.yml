name: Tests end-to-end

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # chaque lundi à 6 h UTC : détecte les régressions côté application
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Playwright (Chromium, Firefox, mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le typage
        run: npm run typecheck

      - name: Installer les navigateurs
        run: npx playwright install --with-deps chromium firefox

      - name: Lancer les tests
        run: npx playwright test

      - name: Conserver le rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  publier-rapport:
    name: Publier le rapport
    needs: tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
